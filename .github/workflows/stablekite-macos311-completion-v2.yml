name: "Complete unacquired native contracts macOS 3.11"

on:
  push:
    branches: ['stablekite/native-contracts-macos311-completion-v2']

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FORCE_COLOR: 1
  TERM: xterm-256color # needed for FORCE_COLOR to work on mypy on Ubuntu, see https://github.com/python/mypy/issues/13817

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  stubtest-stdlib:
    name: "stubtest: stdlib"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-latest"]
        python-version: ["3.11"]
        exclude:
          # https://github.com/python/typeshed/issues/15694
          - os: "windows-latest"
            python-version: "3.10"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: e40a6f0af38b3d3b116fa06ef22c6ed150b3af0c
      - name: Verify exact unchanged reviewed source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "reviewed_source=$actual"
          test "$actual" = "e40a6f0af38b3d3b116fa06ef22c6ed150b3af0c"
      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-tests.txt
          allow-prereleases: true
          check-latest: true
      - name: Install dependencies
        run: pip install -r requirements-tests.txt
      - name: Run stubtest
        run: python tests/stubtest_stdlib.py
